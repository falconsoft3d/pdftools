version: '3.8'

services:
  pdftools:
    build: .
    container_name: pdftools_app
    restart: always
    environment:
      - PORT=5000
    expose:
      - "5000"

  nginx:
    image: nginx:alpine
    container_name: pdftools_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - pdftools
    restart: always
